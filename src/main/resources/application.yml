spring:
  application:
    name: guitar-learning-backend

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1434;databaseName=GUITAR_LEARNING_DB;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:06ngochau11}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        default_schema: dbo
        format_sql: true
        # Migrations use DATETIME2; keep Java Instant mapped to datetime2
        # instead of Hibernate 6's default datetimeoffset, which fails
        # schema validation.
        type:
          preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

server:
  port: ${SERVER_PORT:8800}
  error:
    include-message: never
    include-binding-errors: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:uM9bnoOHZABsfyGU5GatzwW+uHiVMtgG5+JJwRaVfrw=}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  firebase:
    # Firebase project id used to verify Google ID tokens (aud/iss).
    project-id: ${FIREBASE_PROJECT_ID:hguitar-11b68}
